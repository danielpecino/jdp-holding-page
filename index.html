<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JDP Security Ltd | Fire &amp; security systems</title>
<meta name="description" content="JDP Security Ltd: fire and security systems installation, maintenance and repairs. Our new website is coming soon. Email info@jdpsecurity.co.uk.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0098da">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:200 800;font-display:swap;src:url(/jakarta-latin.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1c252c;background:#f4f5f6;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.bar{height:6px;background:#0098da}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
.card{width:100%;max-width:640px;background:#fff;border:1px solid #e2e6ea;border-radius:12px;padding:56px 48px;text-align:center;box-shadow:0 10px 30px rgba(28,37,44,.06)}
.logo{display:block;width:100%;max-width:360px;height:auto;margin:0 auto 32px}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
.tag{font-size:1.0625rem;color:#5a6670;font-weight:500}
hr{border:0;height:1px;background:#e2e6ea;margin:32px auto;width:64px}
.soon{font-size:1.25rem;font-weight:700;margin-bottom:24px}
.btn{display:inline-block;background:#0098da;color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:8px;font-size:1rem;transition:background .15s}
.btn:hover,.btn:focus-visible{background:#007fb8}
.btn:focus-visible{outline:3px solid #ff803b;outline-offset:3px}
footer{text-align:center;font-size:.8125rem;color:#5a6670;padding:20px}
@media (max-width:480px){.card{padding:40px 22px}.logo{max-width:260px;margin-bottom:24px}h1{font-size:1.5rem}.tag{font-size:1rem}.soon{font-size:1.125rem}.btn{display:block;padding:14px 16px;word-break:break-word}}
</style>
</head>
<body>
<div class="bar"></div>
<main>
<div class="card">
<img class="logo" src="/jdp-logo.png" width="900" height="292" alt="JDP Security Ltd logo">
<h1>JDP Security Ltd</h1>
<p class="tag">Fire &amp; security systems: installation, maintenance and repairs</p>
<hr>
<p class="soon">Our new website is coming soon.</p>
<a class="btn" href="mailto:info@jdpsecurity.co.uk">Email info@jdpsecurity.co.uk</a>
</div>
</main>
<footer>&copy; 2026 JDP Security Ltd</footer>
</body>
</html>
